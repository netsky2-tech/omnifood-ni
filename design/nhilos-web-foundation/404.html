<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — NHILOS POS</title>
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('/fonts/plus-jakarta-sans-latin-var.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/inter-latin-var.woff2') format('woff2');
    }
    :root {
      --navy-950: #001829;
      --navy-900: #00253B;
      --emerald-500: #00BF81;
      --emerald-400: #2FE0A4;
      --text-on-dark: #F8FAFC;
      --text-on-dark-muted: #94B4C7;
      --border-dark: #163A54;
      --font-display: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--navy-950); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--text-on-dark);
      background:
        radial-gradient(circle at 15% 0%, rgba(0, 191, 129, 0.16), transparent 34rem),
        linear-gradient(135deg, var(--navy-950), var(--navy-900));
      font-family: var(--font-body);
      line-height: 1.6;
    }
    main {
      width: min(100%, 38rem);
      padding: clamp(2rem, 6vw, 3.5rem);
      border: 1px solid var(--border-dark);
      border-radius: 1.5rem;
      background: rgba(0, 24, 41, 0.66);
      box-shadow: 0 2rem 5rem rgba(0, 0, 0, 0.3);
    }
    .wordmark {
      margin: 0 0 2.5rem;
      color: var(--emerald-400);
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .code {
      margin: 0 0 0.75rem;
      color: var(--emerald-500);
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 12vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.9;
    }
    h1 {
      margin: 0 0 1rem;
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 5vw, 2.35rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 2rem;
      color: var(--text-on-dark-muted);
      font-size: 1rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.65rem 1.1rem;
      border: 1px solid var(--border-dark);
      border-radius: 999px;
      color: var(--text-on-dark);
      font-weight: 600;
      text-decoration: none;
      transition: border-color 160ms ease, background-color 160ms ease;
    }
    a.primary {
      border-color: var(--emerald-500);
      background: var(--emerald-500);
      color: var(--navy-950);
    }
    a:hover { border-color: var(--emerald-400); }
    a.primary:hover { background: var(--emerald-400); }
    a:focus-visible { outline: 3px solid var(--emerald-400); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="wordmark">NHILOS POS</p>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página no existe.</h1>
    <p>El enlace cambió o la dirección está incompleta. Vuelve al inicio para conocer el sistema.</p>
    <div class="actions">
      <a class="primary" href="/">Volver al inicio</a>
      <a href="/#producto">Ver el producto</a>
    </div>
  </main>
</body>
</html>
