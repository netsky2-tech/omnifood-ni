<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="460" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — master tokens (A13)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Esta es la pieza que convierte archivos en sistema. Sin ella, cada aplicación de la marca se rehace a mano.</text>

  <g transform="translate(24,74)">
    <rect width="852" height="372" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="20" y="28" font-size="12" font-weight="600" fill="#1E3A40">Tabla de tokens · fuente única de la marca</text>

    <g font-size="11" fill="#64748B" font-weight="600">
      <text x="24" y="56">CATEGORÍA</text><text x="150" y="56">TOKEN</text>
      <text x="400" y="56">VALOR</text><text x="600" y="56">USO</text><text x="790" y="56">¿VARÍA POR PRODUCTO?</text>
    </g>
    <line x1="20" y1="66" x2="832" y2="66" stroke="#CBD5E1"/>

    <g font-size="11.5" fill="#0F172A">
      <!-- color -->
      <text x="24" y="90" font-weight="600">Color</text>
      <text x="150" y="90" font-family="ui-monospace,Menlo,monospace">color.ink.base</text>
      <text x="400" y="90" font-family="ui-monospace,Menlo,monospace">#1A1A1A</text>
      <text x="600" y="90" fill="#64748B">Texto y superficies</text>
      <text x="790" y="90" fill="#64748B">No</text>
      <text x="150" y="108" font-family="ui-monospace,Menlo,monospace">color.accent.base</text>
      <text x="400" y="108" font-family="ui-monospace,Menlo,monospace">#E4572E</text>
      <text x="600" y="108" fill="#64748B">Acción y énfasis</text>
      <text x="790" y="108" fill="#64748B">No</text>
      <text x="150" y="126" font-family="ui-monospace,Menlo,monospace">color.state.success</text>
      <text x="400" y="126" font-family="ui-monospace,Menlo,monospace">#0F7B4F</text>
      <text x="600" y="126" fill="#64748B">Estado del sistema</text>
      <text x="790" y="126" fill="#1E3A40">Sí — es de producto</text>
      <line x1="20" y1="138" x2="832" y2="138" stroke="#E2E8F0"/>

      <!-- tipografia -->
      <text x="24" y="162" font-weight="600">Tipografía</text>
      <text x="150" y="162" font-family="ui-monospace,Menlo,monospace">type.family.display</text>
      <text x="400" y="162" font-family="ui-monospace,Menlo,monospace">Marca Sans</text>
      <text x="600" y="162" fill="#64748B">Títulos</text>
      <text x="790" y="162" fill="#64748B">No</text>
      <text x="150" y="180" font-family="ui-monospace,Menlo,monospace">type.family.text</text>
      <text x="400" y="180" font-family="ui-monospace,Menlo,monospace">Marca Sans</text>
      <text x="600" y="180" fill="#64748B">Texto corrido</text>
      <text x="790" y="180" fill="#64748B">No</text>
      <text x="150" y="198" font-family="ui-monospace,Menlo,monospace">type.size.body</text>
      <text x="400" y="198" font-family="ui-monospace,Menlo,monospace">16 / 24</text>
      <text x="600" y="198" fill="#64748B">Texto base</text>
      <text x="790" y="198" fill="#64748B">No</text>
      <line x1="20" y1="210" x2="832" y2="210" stroke="#E2E8F0"/>

      <!-- radios -->
      <text x="24" y="234" font-weight="600">Radios</text>
      <text x="150" y="234" font-family="ui-monospace,Menlo,monospace">radius.card</text>
      <text x="400" y="234" font-family="ui-monospace,Menlo,monospace">12</text>
      <text x="600" y="234" fill="#64748B">Tarjetas y modales</text>
      <text x="790" y="234" fill="#64748B">No</text>
      <text x="150" y="252" font-family="ui-monospace,Menlo,monospace">radius.button</text>
      <text x="400" y="252" font-family="ui-monospace,Menlo,monospace">8</text>
      <text x="600" y="252" fill="#64748B">Botones y chips</text>
      <text x="790" y="252" fill="#64748B">No</text>
      <line x1="20" y1="264" x2="832" y2="264" stroke="#E2E8F0"/>

      <!-- espaciado -->
      <text x="24" y="288" font-weight="600">Espaciado</text>
      <text x="150" y="288" font-family="ui-monospace,Menlo,monospace">space.unit</text>
      <text x="400" y="288" font-family="ui-monospace,Menlo,monospace">4</text>
      <text x="600" y="288" fill="#64748B">Base de la escala</text>
      <text x="790" y="288" fill="#64748B">No</text>
      <text x="150" y="306" font-family="ui-monospace,Menlo,monospace">space.scale</text>
      <text x="400" y="306" font-family="ui-monospace,Menlo,monospace">4·8·12·16·24·32·48</text>
      <text x="600" y="306" fill="#64748B">Escala completa</text>
      <text x="790" y="306" fill="#64748B">No</text>
      <line x1="20" y1="318" x2="832" y2="318" stroke="#E2E8F0"/>

      <!-- sombras y motion -->
      <text x="24" y="342" font-weight="600">Sombras</text>
      <text x="150" y="342" font-family="ui-monospace,Menlo,monospace">shadow.raised</text>
      <text x="400" y="342" font-family="ui-monospace,Menlo,monospace">0 2 6 rgba(0,0,0,.10)</text>
      <text x="600" y="342" fill="#64748B">Elevación única</text>
      <text x="790" y="342" fill="#64748B">No</text>
      <text x="24" y="366" font-weight="600">Movimiento</text>
      <text x="150" y="366" font-family="ui-monospace,Menlo,monospace">motion.duration.fast</text>
      <text x="400" y="366" font-family="ui-monospace,Menlo,monospace">120 ms</text>
      <text x="600" y="366" fill="#64748B">Microinteracción</text>
      <text x="790" y="366" fill="#64748B">No</text>
    </g>
  </g>
  <g transform="translate(24,456)" font-size="11" fill="#64748B">
    <text>Formato: tabla (no solo Figma). Y exportado como CSV o JSON para que el equipo pueda consumirlo.</text>
  </g>
</svg>
