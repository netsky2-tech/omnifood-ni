<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="400" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — evidencia de accesibilidad (B2.5)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">La entrega incluye el contraste MEDIDO, no la promesa de que se ve bien. Esta tabla es la evidencia.</text>

  <g transform="translate(24,74)">
    <rect width="500" height="238" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="24" font-size="12" font-weight="600" fill="#1E3A40">Contraste medido por combinación</text>
    <g font-size="11" fill="#64748B" font-weight="600">
      <text x="16" y="50">COMBINACIÓN</text><text x="270" y="50">RATIO</text><text x="340" y="50">MÍNIMO</text><text x="430" y="50">RESULTADO</text>
    </g>
    <line x1="16" y1="58" x2="484" y2="58" stroke="#CBD5E1"/>
    <g font-size="11">
      <text x="16" y="80" fill="#0F172A">Texto principal / fondo</text>
      <text x="270" y="80" fill="#0F172A" font-family="ui-monospace,Menlo,monospace">16.1:1</text>
      <text x="340" y="80" fill="#64748B">4.5:1</text>
      <text x="430" y="80" fill="#0F7B4F" font-weight="600">PASA</text>
      <text x="16" y="102" fill="#0F172A">Texto secundario / fondo</text>
      <text x="270" y="102" fill="#0F172A" font-family="ui-monospace,Menlo,monospace">4.8:1</text>
      <text x="340" y="102" fill="#64748B">4.5:1</text>
      <text x="430" y="102" fill="#0F7B4F" font-weight="600">PASA</text>
      <text x="16" y="124" fill="#0F172A">Texto sobre acento</text>
      <text x="270" y="124" fill="#0F172A" font-family="ui-monospace,Menlo,monospace">3.9:1</text>
      <text x="340" y="124" fill="#64748B">4.5:1</text>
      <text x="430" y="124" fill="#DC2626" font-weight="600">FALLA</text>
      <text x="16" y="146" fill="#0F172A">Borde de botón / fondo</text>
      <text x="270" y="146" fill="#0F172A" font-family="ui-monospace,Menlo,monospace">3.4:1</text>
      <text x="340" y="146" fill="#64748B">3:1</text>
      <text x="430" y="146" fill="#0F7B4F" font-weight="600">PASA</text>
    </g>
    <line x1="16" y1="160" x2="484" y2="160" stroke="#E2E8F0"/>
    <g font-size="11" fill="#64748B">
      <text x="16" y="182">Una combinación que falla no se descarta en silencio:</text>
      <text x="16" y="200">se corrige el valor o se justifica por qué no se usa así.</text>
      <text x="16" y="224" fill="#0F172A">Herramienta usada y fecha de la medición, declaradas.</text>
    </g>
  </g>

  <g transform="translate(548,74)" font-size="11">
    <rect width="328" height="238" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="24" font-size="12" font-weight="600" fill="#1E3A40">Lo demás que hay que evidenciar</text>
    <g transform="translate(16,46)" fill="#0F172A">
      <text y="0" font-weight="600">Foco de teclado</text>
      <g transform="translate(0,10)">
        <rect width="130" height="26" rx="6" fill="#1A1A1A" stroke="#E4572E" stroke-width="3"/>
        <text x="65" y="18" font-size="10.5" fill="#fff" text-anchor="middle">Foco visible</text>
      </g>
      <text y="54" fill="#64748B">En todos los elementos interactivos.</text>

      <text y="84" font-weight="600">Área táctil</text>
      <g transform="translate(0,94)">
        <rect width="44" height="44" rx="6" fill="none" stroke="#0F7B4F" stroke-width="2"/>
        <text x="54" y="18" font-size="10.5" fill="#64748B">Mínimo 44×44 con</text>
        <text x="54" y="34" font-size="10.5" fill="#64748B">la separación incluida.</text>
      </g>

      <text y="164" font-weight="600">Movimiento reducido</text>
      <text y="184" fill="#64748B">Con la preferencia activa, la página</text>
      <text y="200" fill="#64748B">no anima ni hace reveal: el contenido</text>
      <text y="216" fill="#64748B">aparece completo desde el inicio.</text>
    </g>
  </g>

  <text x="24" y="344" font-size="11" fill="#64748B">Umbrales de referencia: 4.5:1 texto normal · 3:1 texto grande y elementos de interfaz · áreas táctiles 44×44 CSS px.</text>
  <text x="24" y="368" font-size="11" fill="#1E3A40">Regla: si una combinación no se midió, no está aprobada. "Se ve bien" no es evidencia.</text>
</svg>
