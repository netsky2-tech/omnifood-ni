<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="300" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — estados de página (B1.3)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Distintos de los estados de componente: acá la página entera cambia y define un siguiente paso.</text>

  <g transform="translate(24,74)" font-size="10.5" fill="#64748B">
    <g>
      <g><rect width="164" height="120" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="10" y="20" font-size="11" fill="#DC2626" font-weight="600">404</text>
        <text x="10" y="42" font-size="11.5" fill="#0F172A">No encontramos</text><text x="10" y="56" font-size="11.5" fill="#0F172A">esa página.</text>
        <rect x="10" y="74" width="76" height="22" rx="4" fill="#1A1A1A"/><text x="48" y="89" font-size="10" fill="#fff" text-anchor="middle">Volver al inicio</text>
        <text x="10" y="112" font-size="10">+ enlaces directos a Producto y Soporte</text></g>
      <g transform="translate(180,0)"><rect width="164" height="120" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
        <text x="10" y="20" font-size="11" fill="#64748B" font-weight="600">Sin resultados</text>
        <rect x="10" y="32" width="144" height="24" rx="4" fill="#fff" stroke="#E2E8F0"/>
        <text x="10" y="76" font-size="11.5" fill="#0F172A">Nada coincide con</text><text x="10" y="90" font-size="11.5" fill="#0F172A">ese criterio.</text>
        <text x="10" y="110" font-size="10">+ acción para limpiar el filtro</text></g>
      <g transform="translate(360,0)"><rect width="164" height="120" rx="6" fill="#F8FAFC" stroke="#DC2626"/>
        <text x="10" y="20" font-size="11" fill="#DC2626" font-weight="600">Error de formulario</text>
        <rect x="10" y="32" width="144" height="24" rx="4" fill="#fff" stroke="#DC2626"/>
        <text x="10" y="70" font-size="10.5" fill="#DC2626">Mensaje junto al campo</text>
        <text x="10" y="88" font-size="10.5" fill="#64748B">Prohibido un alert()</text>
        <text x="10" y="106" font-size="10.5" fill="#64748B">Los datos no se pierden</text></g>
      <g transform="translate(540,0)"><rect width="164" height="120" rx="6" fill="#F8FAFC" stroke="#0F7B4F"/>
        <text x="10" y="20" font-size="11" fill="#0F7B4F" font-weight="600">Envío exitoso</text>
        <text x="10" y="46" font-size="11.5" fill="#0F172A">Recibimos tu solicitud.</text>
        <text x="10" y="66" font-size="10.5" fill="#64748B">Qué pasa ahora</text>
        <text x="10" y="82" font-size="10.5" fill="#64748B">y en cuánto tiempo</text>
        <text x="10" y="104" font-size="10.5" fill="#64748B">+ qué hacer si no llega</text></g>
      <g transform="translate(720,0)"><rect width="156" height="120" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 3"/>
        <text x="10" y="20" font-size="11" fill="#64748B" font-weight="600">No disponible</text>
        <text x="10" y="46" font-size="11.5" fill="#0F172A">Este contenido</text><text x="10" y="60" font-size="11.5" fill="#0F172A">no está listo.</text>
        <text x="10" y="82" font-size="10.5" fill="#64748B">Nunca una página vacía</text>
        <text x="10" y="104" font-size="10.5" fill="#64748B">+ alternativa útil</text></g>
    </g>
  </g>

  <g transform="translate(24,224)">
    <rect width="852" height="60" rx="6" fill="#E6EFF0"/>
    <text x="16" y="24" font-size="11.5" fill="#1E3A40" font-weight="600">Regla que los une</text>
    <text x="16" y="44" font-size="11.5" fill="#0F172A">Ninguno de estos estados es "lo mismo pero gris": cada uno dice qué pasó, qué impacto tiene y cuál es la siguiente acción.</text>
  </g>
</svg>
