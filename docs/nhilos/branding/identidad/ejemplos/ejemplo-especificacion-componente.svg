<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="380" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — especificación de componente (B2.2)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">El componente acotado: medidas, espaciados y estados. Deja de ser una imagen y pasa a poder construirse.</text>

  <g font-size="10.5" fill="#E4572E">
    <g transform="translate(60,96)">
      <!-- cota superior -->
      <line x1="0" y1="-18" x2="196" y2="-18" stroke="#E4572E" stroke-width="1"/>
      <line x1="0" y1="-23" x2="0" y2="-13" stroke="#E4572E"/><line x1="196" y1="-23" x2="196" y2="-13" stroke="#E4572E"/>
      <text x="98" y="-24" text-anchor="middle">ancho mínimo 196 · crece con el contenido</text>
      <!-- cota alto -->
      <line x1="-18" y1="0" x2="-18" y2="48" stroke="#E4572E" stroke-width="1"/>
      <line x1="-23" y1="0" x2="-13" y2="0" stroke="#E4572E"/><line x1="-23" y1="48" x2="-13" y2="48" stroke="#E4572E"/>
      <text x="-26" y="28" text-anchor="end">48</text>
      <!-- padding -->
      <line x1="18" y1="24" x2="18" y2="24" stroke="#E4572E"/>
      <line x1="0" y1="24" x2="18" y2="24" stroke="#E4572E" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="4" y="20" font-size="10">16</text>

      <!-- el boton -->
      <rect width="196" height="48" rx="8" fill="#1A1A1A"/>
      <text x="98" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF" font-family="Inter,sans-serif">Solicitar una demo</text>
      <!-- icono -->
      <text x="176" y="30" font-size="13" fill="#FFFFFF" font-family="Inter,sans-serif">→</text>
      <text x="98" y="72" text-anchor="middle" fill="#64748B" font-family="Inter,sans-serif">radio 8 · tipografía 15/600 · ícono 16</text>
    </g>

    <g transform="translate(60,214)">
      <text x="0" y="0" fill="#1E3A40" font-size="11.5" font-family="Inter,sans-serif" font-weight="600">Los mismos estados, especificados</text>
      <g transform="translate(0,14)" font-family="Inter,sans-serif">
        <g><rect width="106" height="34" rx="8" fill="#1A1A1A"/><text x="53" y="22" font-size="11" fill="#fff" text-anchor="middle">Default</text></g>
        <g transform="translate(118,0)"><rect width="106" height="34" rx="8" fill="#333"/><text x="53" y="22" font-size="11" fill="#fff" text-anchor="middle">Hover</text></g>
        <g transform="translate(236,0)"><rect width="106" height="34" rx="8" fill="#1A1A1A" stroke="#E4572E" stroke-width="3"/><text x="53" y="22" font-size="11" fill="#fff" text-anchor="middle">Focus</text></g>
        <g transform="translate(354,0)"><rect width="106" height="34" rx="8" fill="#0A0A0A"/><text x="53" y="22" font-size="11" fill="#fff" text-anchor="middle">Activo</text></g>
        <g transform="translate(472,0)"><rect width="106" height="34" rx="8" fill="#E2E8F0"/><text x="53" y="22" font-size="11" fill="#94A3B8" text-anchor="middle">Disabled</text></g>
        <g transform="translate(590,0)"><rect width="106" height="34" rx="8" fill="#64748B"/><text x="53" y="22" font-size="11" fill="#fff" text-anchor="middle">Cargando</text></g>
      </g>
      <text x="0" y="74" fill="#64748B" font-family="Inter,sans-serif">Cada estado con su diferencia declarada: no "es el mismo con opacidad".</text>
    </g>
  </g>

  <g transform="translate(430,86)" font-size="11" fill="#0F172A">
    <rect width="446" height="270" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="16" y="26" font-size="12" font-weight="600" fill="#1E3A40">Ficha del componente</text>
    <g transform="translate(16,48)">
      <text y="0" font-weight="600">Medidas</text>
      <text y="20" fill="#64748B">· Alto 48 · radio 8 · padding 16 horizontal</text>
      <text y="38" fill="#64748B">· Área táctil mínima 44×44 (acá se cumple)</text>
      <text y="56" fill="#64748B">· Ancho mínimo 196, crece con el texto</text>

      <text y="86" font-weight="600">Tipografía y color</text>
      <text y="106" fill="#64748B">· Tokens usados: <tspan font-family="ui-monospace,Menlo,monospace">type.size.body</tspan>, <tspan font-family="ui-monospace,Menlo,monospace">color.ink.base</tspan></text>
      <text y="124" fill="#64748B">· Contraste del texto sobre el fondo: medido, no estimado</text>

      <text y="154" font-weight="600">Comportamiento</text>
      <text y="174" fill="#64748B">· Un solo botón primario por pantalla</text>
      <text y="192" fill="#64748B">· Durante "Cargando" queda bloqueado y anuncia el estado</text>
      <text y="210" fill="#64748B">· Con el teclado: foco visible y activación con Enter y Espacio</text>

      <text y="240" font-weight="600">Lo que se entrega con él</text>
      <text y="260" fill="#64748B">· El componente en cada estado, y la ficha de medidas.</text>
      <text y="278" fill="#64748B">· No una captura: el componente y su especificación.</text>
    </g>
  </g>
</svg>
