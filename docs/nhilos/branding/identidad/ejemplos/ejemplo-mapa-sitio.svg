<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — mapa del sitio (B1.1)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Las rutas y su relación. Es la primera pieza de B1 y la que ordena todo lo demás.</text>

  <!-- Arbol dibujado con lineas: no depende de que la fuente sea monoespaciada -->
  <g transform="translate(24,86)">
    <g stroke="#CBD5E1" stroke-width="1.2" fill="none">
      <line x1="34" y1="34" x2="34" y2="330"/>
      <line x1="34" y1="34" x2="46" y2="34"/>
      <line x1="34" y1="146" x2="46" y2="146"/>
      <line x1="34" y1="172" x2="46" y2="172"/>
      <line x1="34" y1="198" x2="46" y2="198"/>
      <line x1="34" y1="284" x2="46" y2="284"/>
      <line x1="34" y1="310" x2="46" y2="310"/>
      <line x1="34" y1="330" x2="46" y2="330"/>
      <line x1="80" y1="60" x2="80" y2="106"/>
      <line x1="80" y1="60" x2="94" y2="60"/>
      <line x1="80" y1="83" x2="94" y2="83"/>
      <line x1="80" y1="106" x2="94" y2="106"/>
      <line x1="80" y1="224" x2="80" y2="250"/>
      <line x1="80" y1="224" x2="94" y2="224"/>
      <line x1="80" y1="250" x2="94" y2="250"/>
    </g>

    <g font-size="12">
      <circle cx="34" cy="0" r="3" fill="#1E3A40"/>
      <text x="0" y="4" font-family="ui-monospace,Menlo,monospace" font-weight="700" fill="#0F172A">/</text>
      <text x="46" y="4" fill="#64748B">Home — introduce la propuesta</text>

      <text x="46" y="38" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/pos</text>
      <text x="130" y="38" fill="#64748B">Profundiza el producto</text>

      <text x="94" y="64" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">/pos#operacion</text>
      <text x="300" y="64" fill="#64748B" font-size="11">argumento</text>
      <text x="94" y="87" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">/pos#capacidades</text>
      <text x="300" y="87" fill="#64748B" font-size="11">argumento</text>
      <text x="94" y="110" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">/pos#implementacion</text>
      <text x="300" y="110" fill="#64748B" font-size="11">argumento</text>

      <text x="46" y="150" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/implementacion</text>
      <text x="210" y="150" fill="#64748B">Proceso</text>
      <text x="46" y="176" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/soporte</text>
      <text x="210" y="176" fill="#64748B">Canales y compromisos</text>
      <text x="46" y="202" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/recursos</text>
      <text x="210" y="202" fill="#64748B">Contenido</text>

      <text x="94" y="228" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">/recursos/guias</text>
      <text x="300" y="228" fill="#64748B" font-size="11">condicional</text>
      <text x="94" y="254" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#64748B">/recursos/faq</text>
      <text x="300" y="254" fill="#64748B" font-size="11">resuelve objeciones</text>

      <text x="46" y="288" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/nosotros</text>
      <text x="210" y="288" fill="#64748B">La compañía</text>

      <rect x="42" y="300" width="132" height="20" rx="4" fill="#E6EFF0"/>
      <text x="46" y="314" font-family="ui-monospace,Menlo,monospace" fill="#1E3A40" font-weight="600">/solicitar-demo</text>
      <text x="210" y="314" fill="#1E3A40" font-weight="600">Conversión — única</text>

      <text x="46" y="334" font-family="ui-monospace,Menlo,monospace" fill="#0F172A">/legal/privacidad</text>
      <text x="210" y="334" fill="#64748B">+ /legal/terminos</text>
    </g>

    <g transform="translate(560,0)">
      <rect width="292" height="230" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="24" font-size="12" font-weight="600" fill="#1E3A40">Lo que el mapa debe declarar</text>
      <g transform="translate(16,42)" font-size="11" fill="#0F172A">
        <text y="0">· La ruta y su propósito en una frase.</text>
        <text y="20">· Qué página introduce y cuál resuelve.</text>
        <text y="40">· La única ruta de conversión.</text>
        <text y="60">· Qué es condicional y bajo qué</text>
        <text y="76">condición.</text>
        <text y="96">· Qué NO existe todavía, declarado</text>
        <text y="112">como tal.</text>
      </g>
      <g transform="translate(16,150)" font-size="11">
        <text y="0" fill="#DC2626" font-weight="600">Lo que no puede pasar</text>
        <text y="20" fill="#DC2626">· Una ruta por capacidad.</text>
        <text y="38" fill="#DC2626">· Productos futuros en el mapa.</text>
        <text y="56" fill="#DC2626">· Dos caminos de conversión.</text>
      </g>
    </g>
  </g>
</svg>
