<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="340" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — mapa del sitio (B1.1)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Las rutas y su relación. Es la primera pieza de B1 y la que ordena todo lo demás.</text>

  <g transform="translate(24,80)" font-size="12">
    <g font-family="ui-monospace,Menlo,monospace" fill="#0F172A">
      <text y="0" font-weight="700">/</text><text x="70" y="0" fill="#64748B" font-family="Inter,sans-serif">Home — introduce la propuesta</text>
      <text y="26">├── /pos</text><text x="70" y="26" fill="#64748B" font-family="Inter,sans-serif">Profundiza el producto</text>
      <text y="52">│   ├── /pos#operacion</text><text x="230" y="52" fill="#64748B" font-family="Inter,sans-serif">Argumento</text>
      <text y="74">│   ├── /pos#capacidades</text><text x="230" y="74" fill="#64748B" font-family="Inter,sans-serif">Argumento</text>
      <text y="96">│   └── /pos#implementacion</text><text x="230" y="96" fill="#64748B" font-family="Inter,sans-serif">Argumento</text>
      <text y="122">├── /implementacion</text><text x="70" y="122" fill="#64748B" font-family="Inter,sans-serif">Proceso</text>
      <text y="148">├── /soporte</text><text x="70" y="148" fill="#64748B" font-family="Inter,sans-serif">Canales y compromisos</text>
      <text y="174">├── /recursos</text><text x="70" y="174" fill="#64748B" font-family="Inter,sans-serif">Contenido</text>
      <text y="196">│   ├── /recursos/guias</text><text x="230" y="196" fill="#64748B" font-family="Inter,sans-serif">Condicional</text>
      <text y="218">│   └── /recursos/faq</text><text x="230" y="218" fill="#64748B" font-family="Inter,sans-serif">Resuelve objeciones</text>
      <text y="244">├── /nosotros</text><text x="70" y="244" fill="#64748B" font-family="Inter,sans-serif">La compañía</text>
      <text y="270">├── /solicitar-demo</text><text x="70" y="270" fill="#1E3A40" font-family="Inter,sans-serif" font-weight="600">Conversión — única</text>
      <text y="292">└── /legal/privacidad · /legal/terminos</text>
    </g>

    <g transform="translate(560,0)">
      <rect width="316" height="200" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="16" y="24" font-size="12" font-weight="600" fill="#1E3A40">Lo que el mapa debe declarar</text>
      <g transform="translate(16,42)" font-size="11" fill="#0F172A">
        <text y="0">· La ruta y su propósito en una frase.</text>
        <text y="20">· Qué página introduce y cuál resuelve.</text>
        <text y="40">· La única ruta de conversión.</text>
        <text y="60">· Qué es condicional y bajo qué condición.</text>
        <text y="80">· Qué NO existe todavía, declarado como tal.</text>
      </g>
      <g transform="translate(16,140)" font-size="11" fill="#DC2626">
        <text y="0" font-weight="600">Lo que no puede pasar</text>
        <text y="20">· Una ruta por capacidad del producto.</text>
        <text y="38">· Productos futuros en el mapa.</text>
        <text y="56">· Dos caminos de conversión.</text>
      </g>
    </g>
  </g>
</svg>
