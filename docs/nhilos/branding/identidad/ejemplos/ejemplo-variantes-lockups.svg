<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="420" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — variantes del mark y lockups de producto (A3 · A4)</text>
  <text x="24" y="54" font-size="12" fill="#64748B">Marca de relleno. Muestra qué debe contener la pieza y cómo se documenta, no una propuesta visual.</text>

  <g font-size="11" fill="#64748B">
    <!-- variantes -->
    <text x="24" y="86" font-size="12" font-weight="600" fill="#1E3A40">Variantes obligatorias</text>
    <g transform="translate(24,98)">
      <rect width="852" height="118" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <g transform="translate(20,20)">
        <!-- principal -->
        <g><rect width="130" height="80" rx="4" fill="#fff" stroke="#E2E8F0"/>
          <g transform="translate(38,18)"><circle cx="14" cy="14" r="13" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="14" y="1" width="26" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="4"/></g>
          <text x="65" y="72" text-anchor="middle" fill="#0F172A">Principal</text></g>
        <!-- horizontal -->
        <g transform="translate(150,0)"><rect width="130" height="80" rx="4" fill="#fff" stroke="#E2E8F0"/>
          <g transform="translate(16,26)"><circle cx="12" cy="12" r="11" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="12" y="1" width="22" height="22" rx="5" fill="none" stroke="#0F172A" stroke-width="4"/></g>
          <text x="56" y="34" font-size="15" font-weight="700" fill="#0F172A">MARCA</text>
          <text x="65" y="66" text-anchor="middle" fill="#0F172A">Horizontal</text></g>
        <!-- isotipo -->
        <g transform="translate(300,0)"><rect width="130" height="80" rx="4" fill="#fff" stroke="#E2E8F0"/>
          <g transform="translate(51,18)"><circle cx="14" cy="14" r="13" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="14" y="1" width="26" height="26" rx="6" fill="none" stroke="#0F172A" stroke-width="4"/></g>
          <text x="65" y="72" text-anchor="middle" fill="#0F172A">Isotipo</text></g>
        <!-- monocromo -->
        <g transform="translate(450,0)"><rect width="130" height="80" rx="4" fill="#fff" stroke="#E2E8F0"/>
          <g transform="translate(38,18)"><circle cx="14" cy="14" r="13" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="14" y="1" width="26" height="26" rx="6" fill="#0F172A"/></g>
          <text x="65" y="72" text-anchor="middle" fill="#0F172A">Monocromo</text></g>
        <!-- negativo -->
        <g transform="translate(600,0)"><rect width="130" height="80" rx="4" fill="#0F172A"/>
          <g transform="translate(38,18)"><circle cx="14" cy="14" r="13" fill="none" stroke="#fff" stroke-width="4"/><rect x="14" y="1" width="26" height="26" rx="6" fill="none" stroke="#fff" stroke-width="4"/></g>
          <text x="65" y="72" text-anchor="middle" fill="#F8FAFC">Negativo</text></g>
        <!-- un color -->
        <g transform="translate(750,0)"><rect width="82" height="80" rx="4" fill="#fff" stroke="#E2E8F0"/>
          <g transform="translate(14,18)"><circle cx="14" cy="14" r="13" fill="none" stroke="#E4572E" stroke-width="4"/><rect x="14" y="1" width="26" height="26" rx="6" fill="none" stroke="#E4572E" stroke-width="4"/></g>
          <text x="41" y="72" text-anchor="middle" fill="#0F172A">1 color</text></g>
      </g>
    </g>

    <!-- lockups -->
    <text x="24" y="252" font-size="12" font-weight="600" fill="#1E3A40">Lockups con producto — la relación marca madre / producto</text>
    <g transform="translate(24,264)">
      <rect width="410" height="140" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
      <g transform="translate(24,22)">
        <g><circle cx="12" cy="12" r="11" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="12" y="1" width="22" height="22" rx="5" fill="none" stroke="#0F172A" stroke-width="4"/></g>
        <text x="44" y="19" font-size="17" font-weight="700" fill="#0F172A">NHILOS</text>
        <line x1="0" y1="46" x2="160" y2="46" stroke="#E2E8F0"/>
        <text x="0" y="72" font-size="11" fill="#64748B">Relación aprobada:</text>
        <text x="0" y="90" font-size="12" font-weight="600" fill="#1E3A40">NHILOS  →  NHILOS POS</text>
        <text x="0" y="108" font-size="11" fill="#64748B">Una marca con productos.</text>
      </g>
      <g transform="translate(210,22)">
        <g><circle cx="12" cy="12" r="11" fill="none" stroke="#0F172A" stroke-width="4"/><rect x="12" y="1" width="22" height="22" rx="5" fill="none" stroke="#0F172A" stroke-width="4"/></g>
        <text x="44" y="19" font-size="17" font-weight="700" fill="#0F172A">NHILOS</text>
        <text x="44" y="38" font-size="12" fill="#64748B">POS</text>
        <rect x="0" y="56" width="180" height="58" rx="4" fill="#fff" stroke="#E2E8F0"/>
        <text x="10" y="76" font-size="11" fill="#0F172A">Lockup vertical</text>
        <text x="10" y="94" font-size="11" fill="#64748B">Espacios estrechos</text>
        <text x="10" y="108" font-size="11" fill="#64748B">y cuadrados</text>
      </g>
    </g>
    <g transform="translate(456,264)">
      <rect width="420" height="140" rx="6" fill="#F8FAFC" stroke="#DC2626" stroke-dasharray="4 3"/>
      <text x="18" y="26" font-size="12" font-weight="600" fill="#DC2626">Lo que no se hace</text>
      <text x="18" y="52" font-size="12" fill="#0F172A">✗  NHILOS POS by NHILOS</text>
      <text x="18" y="74" font-size="12" fill="#0F172A">✗  NHILOS Inventario / NHILOS Cocina</text>
      <text x="18" y="96" font-size="12" fill="#0F172A">✗  Un logotipo nuevo por módulo</text>
      <text x="18" y="118" font-size="12" fill="#0F172A">✗  Sub-marcas o co-branding</text>
    </g>
  </g>
</svg>
