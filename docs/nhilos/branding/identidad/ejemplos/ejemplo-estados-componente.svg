<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="300" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — matriz de estados</text>
  <text x="24" y="54" font-size="12" fill="#64748B">El hueco más común: se diseña el camino feliz y el resto se improvisa en código. Cada estado se diseña.</text>

  <g transform="translate(24,72)">
    <rect width="852" height="200" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <g font-size="11">
      <!-- fila 1: boton -->
      <text x="20" y="40" fill="#64748B" font-weight="600">BOTÓN</text>
      <g transform="translate(110,22)">
        <g transform="translate(0,0)"><rect width="86" height="32" rx="8" fill="#1A1A1A"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Default</text></g>
        <g transform="translate(100,0)"><rect width="86" height="32" rx="8" fill="#333"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Hover</text></g>
        <g transform="translate(200,0)"><rect width="86" height="32" rx="8" fill="#1A1A1A" stroke="#E4572E" stroke-width="3"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Focus</text></g>
        <g transform="translate(300,0)"><rect width="86" height="32" rx="8" fill="#0A0A0A"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Activo</text></g>
        <g transform="translate(400,0)"><rect width="86" height="32" rx="8" fill="#E2E8F0"/><text x="43" y="21" font-size="12" fill="#94A3B8" text-anchor="middle">Disabled</text></g>
        <g transform="translate(500,0)"><rect width="86" height="32" rx="8" fill="#64748B"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Cargando</text></g>
        <g transform="translate(600,0)"><rect width="86" height="32" rx="8" fill="#DC2626"/><text x="43" y="21" font-size="12" fill="#fff" text-anchor="middle">Error</text></g>
      </g>
      <line x1="20" y1="76" x2="832" y2="76" stroke="#E2E8F0"/>

      <!-- fila 2: campo -->
      <text x="20" y="116" fill="#64748B" font-weight="600">CAMPO</text>
      <g transform="translate(110,98)">
        <g><rect width="86" height="32" rx="8" fill="#fff" stroke="#E2E8F0"/><text x="10" y="21" font-size="11" fill="#94A3B8">vacío</text></g>
        <g transform="translate(100,0)"><rect width="86" height="32" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><text x="10" y="21" font-size="11" fill="#0F172A">foco</text></g>
        <g transform="translate(200,0)"><rect width="86" height="32" rx="8" fill="#fff" stroke="#DC2626" stroke-width="2"/><text x="10" y="21" font-size="11" fill="#64748B">texto</text><rect x="10" y="36" width="120" height="3" rx="1.5" fill="#DC2626"/><text x="10" y="52" font-size="10" fill="#DC2626">mensaje de error</text></g>
        <g transform="translate(300,0)"><rect width="86" height="32" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/><text x="10" y="21" font-size="11" fill="#94A3B8">readonly</text></g>
        <g transform="translate(400,0)"><rect width="86" height="32" rx="8" fill="#fff" stroke="#0F7B4F" stroke-width="2"/><text x="10" y="21" font-size="11" fill="#0F172A">válido</text></g>
      </g>
      <line x1="20" y1="160" x2="832" y2="160" stroke="#E2E8F0"/>

      <!-- fila 3: pagina -->
      <text x="20" y="186" fill="#64748B" font-weight="600">PÁGINA</text>
      <g transform="translate(110,170)" font-size="11" fill="#1E3A40">
        <text x="0" y="16">sin resultados</text><text x="150" y="16">404</text>
        <text x="240" y="16">error de formulario</text><text x="420" y="16">envío exitoso</text>
        <text x="570" y="16">contenido no disponible</text>
      </g>
    </g>
  </g>
  <text x="24" y="290" font-size="11" fill="#64748B">Estos estados de página tampoco son "lo mismo pero gris": cada uno tiene su mensaje y su siguiente paso.</text>
</svg>
