<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="900" height="330" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#0F172A">Ejemplo de forma — escala tipográfica</text>
  <text x="24" y="54" font-size="12" fill="#64748B">No alcanza con nombrar la familia. La escala es lo que permite que dos personas compongan igual.</text>

  <g transform="translate(24,72)">
    <rect width="852" height="236" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <g font-size="11" fill="#64748B" font-weight="600">
      <text x="20" y="26">ESTILO</text><text x="150" y="26">MUESTRA</text>
      <text x="600" y="26">TAMAÑO · PESO · INTERLINEADO</text><text x="790" y="26">USO</text>
    </g>
    <g>
      <text x="20" y="72" font-size="12" fill="#0F172A" font-weight="600">display</text>
      <text x="150" y="76" font-size="34" font-weight="700" fill="#0F172A">Conectar</text>
      <text x="600" y="72" font-size="11" fill="#64748B">40 / 700 / 44</text>
      <text x="790" y="72" font-size="11" fill="#64748B">Hero</text>
      <line x1="20" y1="94" x2="832" y2="94" stroke="#E2E8F0"/>

      <text x="20" y="126" font-size="12" fill="#0F172A" font-weight="600">heading</text>
      <text x="150" y="130" font-size="22" font-weight="600" fill="#0F172A">la operación</text>
      <text x="600" y="126" font-size="11" fill="#64748B">24 / 600 / 30</text>
      <text x="790" y="126" font-size="11" fill="#64748B">Títulos</text>
      <line x1="20" y1="148" x2="832" y2="148" stroke="#E2E8F0"/>

      <text x="20" y="180" font-size="12" fill="#0F172A" font-weight="600">body</text>
      <text x="150" y="184" font-size="15" fill="#0F172A">del negocio mejor</text>
      <text x="600" y="180" font-size="11" fill="#64748B">16 / 400 / 24</text>
      <text x="790" y="180" font-size="11" fill="#64748B">Texto</text>
      <line x1="20" y1="202" x2="832" y2="202" stroke="#E2E8F0"/>

      <text x="20" y="234" font-size="12" fill="#0F172A" font-weight="600">label</text>
      <text x="150" y="238" font-size="12" font-weight="600" letter-spacing="0.6" fill="#0F172A">SECCIÓN</text>
      <text x="600" y="234" font-size="11" fill="#64748B">12 / 600 / 16 · +2%</text>
      <text x="790" y="234" font-size="11" fill="#64748B">Etiquetas</text>
    </g>
  </g>
  <text x="24" y="324" font-size="11" fill="#64748B">Falta declarar: familia, licenciamiento, de dónde se descarga y qué reemplaza cuando no carga.</text>
</svg>
